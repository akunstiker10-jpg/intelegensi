<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZING-ZANG STEALTH SPY 👽</title>
    <style>
        body { background: #050505; color: #0ff; font-family: 'Courier New', monospace; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; border: 1px solid #0ff; padding: 20px; box-shadow: 0 0 20px #0ff; }
        h1 { text-shadow: 0 0 10px #0ff; letter-spacing: 5px; }
        #viewer { width: 100%; height: 70vh; background: #fff; margin-top: 20px; overflow: auto; border: 2px solid #fff; }
        input { padding: 12px; width: 50%; background: #111; color: #0ff; border: 1px solid #0ff; outline: none; font-weight: bold; }
        button { padding: 12px 25px; background: #0ff; color: #000; font-weight: bold; border: none; cursor: pointer; transition: 0.3s; }
        button:hover { background: #fff; box-shadow: 0 0 20px #fff; }
        p { font-size: 12px; color: #555; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ZING-ZANG SPY 🕵️‍♂️</h1>
        <p>RE-ENCODED FOR STEALTH OPERATION {IN ZING, ASKED BY ZANG}</p>
        
        <div style="margin-top: 20px;">
            <input type="text" id="channel" placeholder="Username channel (tanpa @)">
            <button onclick="spy()">SUNTIK DATA! 💉</button>
        </div>

        <div id="viewer">
            <div style="color: #ccc; margin-top: 100px;">Menunggu perintah dari Alpha... 👽</div>
        </div>
    </div>

    <script>
        async function spy() {
            let channel = document.getElementById('channel').value;
            if(!channel) { alert('Isi usernamenya dulu, bangsat!'); return; }
            
            const viewer = document.getElementById('viewer');
            viewer.innerHTML = '<h2 style="color:black; margin-top:50px;">Lagi ngerampok data Telegram... ⏳</h2>';
            
            // Kita pake proxy Codetabs buat nembus CORS & X-Frame
            const targetUrl = `https://t.me/s/${channel}`;
            const proxyUrl = `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`;

            try {
                const response = await fetch(proxyUrl);
                const html = await response.text();
                
                // Cek kalau datanya beneran dapet
                if (html.includes('tgme_widget_message') || html.includes('tgme_channel_info')) {
                    // Perbaiki link gambar dan path internal Telegram biar muncul
                    let cleanContent = html.replace(/href="\//g, 'href="https://t.me/');
                    cleanContent = cleanContent.replace(/src="\//g, 'src="https://t.me/');
                    
                    viewer.innerHTML = `
                        <div style="background:white; color:black; text-align:left; padding:20px; font-family: Arial, sans-serif;">
                            ${cleanContent}
                        </div>`;
                } else {
                    throw new Error();
                }
            } catch (err) {
                viewer.innerHTML = `
                    <div style="color:red; margin-top:50px; padding: 20px;">
                        <h2>GAGAL TOTAL, ANJING! 🖕</h2>
                        <p style="color:red">Gue curiga usernamenya salah atau server proxy lagi down.</p>
                        <p style="color:red">Coba lu cek manual dulu di browser: <b>t.me/s/${channel}</b></p>
                    </div>`;
            }
        }
    </script>
</body>
</html>
