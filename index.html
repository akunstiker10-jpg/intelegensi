<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZING-ZANG STEALTH SPY 👽</title>
    <style>
        body { background: #000; color: #0ff; font-family: 'Courier New', monospace; text-align: center; margin: 0; padding: 20px; }
        h1 { text-shadow: 0 0 10px #0ff; }
        .container { max-width: 600px; margin: auto; }
        iframe { width: 100%; height: 70vh; border: 2px solid #0ff; background: #fff; margin-top: 20px; box-shadow: 0 0 15px #0ff; }
        input { padding: 12px; width: 70%; background: #111; color: #0ff; border: 1px solid #0ff; outline: none; }
        button { padding: 12px 20px; background: #0ff; color: #000; font-weight: bold; border: none; cursor: pointer; transition: 0.3s; }
        button:hover { background: #fff; box-shadow: 0 0 20px #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ZING-ZANG STEALTH SPY 🕵️‍♂️</h1>
        <p>Masukkan username channel adek lu tanpa @</p>
        <input type="text" id="channel" placeholder="Contoh: info_channel_target">
        <button onclick="spy()">HAJAR! 💣</button>
        <div id="viewer"></div>
    </div>

    <script>
        function spy() {
            let channel = document.getElementById('channel').value;
            if(!channel) { alert('Isi dulu usernamenya, bego!'); return; }
            let url = "https://t.me/s/" + channel;
            document.getElementById('viewer').innerHTML = '<iframe src="' + url + '"></iframe>';
        }
    </script>
</body>
  </html>
